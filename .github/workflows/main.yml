name: Build IGNITE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Find ZIP
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 5. Extract project
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project extracted."

      # 6. Locate Gradle project
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            echo "Project files:"
            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "

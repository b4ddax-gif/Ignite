name: Build IGNITE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find project -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Remove google-services.json
        shell: bash
        run: |
          echo "Searching for google-services.json..."

          find "$PROJECT_DIR" \
            -type f \
            -name "google-services.json" \
            -delete

          echo "google-services.json removed if present."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building IGNITE APK..."
          echo "Skipping Google Services because IGNITE does not use Firebase."

          gradle assembleDebug \
            -x :app:processDebugGoogleServices \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/IGNITE.apk"

      - name: Upload IGNITE APK
        uses: actions/upload-artifact@v4
        with:
          name: IGNITE-APK
          path: IGNITE.apk
          if-no-files-found: error
